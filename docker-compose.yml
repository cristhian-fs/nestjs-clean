services:
  postgres:
    container_name: nest-clean-pg
    image: postgres
    ports:
      - 5555:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nest-clean

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=cris
      - MINIO_ROOT_PASSWORD=crisfdevpwd
    networks:
      mynet:
        aliases:
          - my-localhost

    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

networks:
  mynet:
    driver: bridge

volumes:
  minio_data:
    driver: local
